name: release-direct

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref_name }}'
  cancel-in-progress: false

env:
  RNP_REF: v0.18.1

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v4

    - name: Cache RNPFramework.xcframework
      id: framework-cache
      uses: actions/cache@v4
      with:
        path: Vendor/RNPFramework.xcframework
        key: rnp-${{ env.RNP_REF }}-framework-${{ hashFiles('scripts/build-rnp-framework.sh', 'Vendor/SOURCES.md') }}

    - name: Build RNPFramework.xcframework
      if: steps.framework-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-rnp-framework.sh

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Import signing certificate
      env:
        APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      run: |
        CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
        KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
        echo -n "${APPLE_CERTIFICATE_P12}" | base64 --decode > "${CERTIFICATE_PATH}"
        security create-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
        security unlock-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security import "${CERTIFICATE_PATH}" -P "${APPLE_CERTIFICATE_P12_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
        security list-keychain -d user -s "${KEYCHAIN_PATH}"

    - name: Write App Store Connect API key
      env:
        APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
      run: |
        mkdir -p "${RUNNER_TEMP}/asc"
        echo -n "${APPLE_ASC_API_KEY_P8}" | base64 --decode > "${RUNNER_TEMP}/asc/AuthKey_${{ secrets.APPLE_ASC_API_KEY_ID }}.p8"

    - name: Build and notarize release
      env:
        DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        ASC_API_KEY_P8: "${RUNNER_TEMP}/asc/AuthKey_${{ secrets.APPLE_ASC_API_KEY_ID }}.p8"
        ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      run: ./scripts/release-direct.sh

    - name: Clean up keychain
      if: always()
      run: |
        KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
        security delete-keychain "${KEYCHAIN_PATH}" || true

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
        else
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
        fi

  smoke-test:
    needs: build-and-release
    runs-on: macos-14
    steps:
    - name: Download release DMG
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" -p '*.dmg' -D "${RUNNER_TEMP}/dist"

    - name: Attach DMG and verify Gatekeeper
      run: |
        DMG="$(find "${RUNNER_TEMP}/dist" -name '*.dmg' | head -n1)"
        VOLUME="/Volumes/RNP Installer"
        hdiutil attach "${DMG}" -nobrowse
        APP="${VOLUME}/RNP.app"
        spctl -a -t exec -vv "${APP}"
        "${APP}/Contents/MacOS/RNP" --self-test
        hdiutil detach "${VOLUME}"
