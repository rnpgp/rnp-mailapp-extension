name: release-direct

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref_name }}'
  cancel-in-progress: false

env:
  RNP_REF: v0.18.1

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Set up Ruby + fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Cache RNPFramework.xcframework
      id: framework-cache
      uses: actions/cache@v6
      with:
        path: Vendor/RNPFramework.xcframework
        key: rnp-${{ env.RNP_REF }}-framework-${{ hashFiles('scripts/build-rnp-framework.sh', 'Vendor/SOURCES.md') }}

    - name: Build RNPFramework.xcframework
      if: steps.framework-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-rnp-framework.sh

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Build, sign, notarize, package
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        MATCH_GIT_BASIC_AUTH_B64: ${{ secrets.MATCH_GIT_BASIC_AUTH_B64 }}
      run: bundle exec fastlane mac release_direct

    - name: Create or update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    needs: build-and-release
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Download release DMG
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" -p '*.dmg' -D "${RUNNER_TEMP}/dist"

    - name: Attach DMG and verify Gatekeeper
      run: |
        DMG="$(find "${RUNNER_TEMP}/dist" -name '*.dmg' | head -n1)"
        VOLUME="/Volumes/RNP Installer"
        hdiutil attach "${DMG}" -nobrowse
        APP="${VOLUME}/RNP.app"
        spctl -a -t exec -vv "${APP}"
        "${APP}/Contents/MacOS/RNP" --self-test
        hdiutil detach "${VOLUME}"
