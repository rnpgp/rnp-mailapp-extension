name: release-direct

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref_name }}'
  cancel-in-progress: false

env:
  RNP_REF: v0.18.1

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Cache RNPFramework.xcframework
      id: framework-cache
      uses: actions/cache@v6
      with:
        path: Vendor/RNPFramework.xcframework
        key: rnp-${{ env.RNP_REF }}-framework-${{ hashFiles('scripts/build-rnp-framework.sh', 'Vendor/SOURCES.md') }}

    - name: Build RNPFramework.xcframework
      if: steps.framework-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-rnp-framework.sh

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Import signing certificate
      uses: Apple-Actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}

    - name: Write App Store Connect API key
      env:
        APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
      run: |
        mkdir -p "${RUNNER_TEMP}/asc"
        echo -n "${APPLE_ASC_API_KEY_P8}" | base64 --decode > "${RUNNER_TEMP}/asc/AuthKey_${{ secrets.APPLE_ASC_API_KEY_ID }}.p8"

    - name: Build and notarize release
      env:
        DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        ASC_API_KEY_P8: "${{ runner.temp }}/asc/AuthKey_${{ secrets.APPLE_ASC_API_KEY_ID }}.p8"
        ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      run: ./scripts/release-direct.sh

    - name: Create or update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    needs: build-and-release
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Download release DMG
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" -p '*.dmg' -D "${RUNNER_TEMP}/dist"

    - name: Attach DMG and verify Gatekeeper
      run: |
        DMG="$(find "${RUNNER_TEMP}/dist" -name '*.dmg' | head -n1)"
        VOLUME="/Volumes/RNP Installer"
        hdiutil attach "${DMG}" -nobrowse
        APP="${VOLUME}/RNP.app"
        spctl -a -t exec -vv "${APP}"
        "${APP}/Contents/MacOS/RNP" --self-test
        hdiutil detach "${VOLUME}"
