name: release-appstore

# Run after the direct-download release workflow has successfully completed.
# release-direct is itself triggered by v* tags, so this effectively uploads
# a matching Mac App Store build for every version tag.
on:
  workflow_run:
    workflows: [release-direct]
    types: [completed]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}'
  cancel-in-progress: false

env:
  RNP_REF: v0.18.1

jobs:
  upload-appstore:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0

    - name: Determine tag
      id: tag
      run: |
        TAG=$(git describe --tags --exact-match "${{ github.event.workflow_run.head_sha }}" 2>/dev/null || true)
        if [[ -z "${TAG}" ]]; then
          echo "The triggering workflow was not for a tag; nothing to upload."
          exit 0
        fi
        echo "TAG=${TAG}" >> "$GITHUB_ENV"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Tag: ${TAG}"

    - name: Check Apple credentials
      if: startsWith(env.TAG, 'v')
      env:
        APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      run: |
        missing=()
        [[ -n "${APPLE_ASC_API_KEY_P8}" ]] || missing+=("APPLE_ASC_API_KEY_P8")
        [[ -n "${APPLE_ASC_API_KEY_ID}" ]] || missing+=("APPLE_ASC_API_KEY_ID")
        [[ -n "${APPLE_ASC_ISSUER_ID}" ]] || missing+=("APPLE_ASC_ISSUER_ID")
        [[ -n "${APPLE_TEAM_ID}" ]] || missing+=("APPLE_TEAM_ID")
        [[ -n "${APPLE_CERTIFICATE_P12}" ]] || missing+=("APPLE_CERTIFICATE_P12")
        [[ -n "${APPLE_CERTIFICATE_P12_PASSWORD}" ]] || missing+=("APPLE_CERTIFICATE_P12_PASSWORD")
        [[ -n "${APPLE_KEYCHAIN_PASSWORD}" ]] || missing+=("APPLE_KEYCHAIN_PASSWORD")
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "Missing secrets required for the Mac App Store upload: ${missing[*]}" >&2
          exit 1
        fi

    - name: Cache RNPFramework.xcframework
      if: startsWith(env.TAG, 'v')
      id: framework-cache
      uses: actions/cache@v6
      with:
        path: Vendor/RNPFramework.xcframework
        key: rnp-${{ env.RNP_REF }}-framework-${{ hashFiles('scripts/build-rnp-framework.sh', 'Vendor/SOURCES.md') }}

    - name: Build RNPFramework.xcframework
      if: ${{ startsWith(env.TAG, 'v') && steps.framework-cache.outputs.cache-hit != 'true' }}
      run: ./scripts/build-rnp-framework.sh

    - name: Write App Store Connect API key
      if: startsWith(env.TAG, 'v')
      env:
        APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
      run: |
        mkdir -p "${RUNNER_TEMP}/asc"
        printf '%s' "${APPLE_ASC_API_KEY_P8}" > "${RUNNER_TEMP}/asc/AuthKey_${{ secrets.APPLE_ASC_API_KEY_ID }}.p8"

    - name: Import signing certificate
      if: startsWith(env.TAG, 'v')
      uses: Apple-Actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}

    - name: Build and export App Store archive
      if: startsWith(env.TAG, 'v')
      env:
        DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        ASC_API_KEY_P8: "${{ runner.temp }}/asc/AuthKey_${{ secrets.APPLE_ASC_API_KEY_ID }}.p8"
        ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        BUILD_NUMBER: ${{ github.run_number }}
        TAG: ${{ env.TAG }}
        SKIP_UPLOAD: 1
      run: ./scripts/release-appstore.sh

    - name: Sandbox audit
      if: startsWith(env.TAG, 'v')
      env:
        AUDIT_APP_PATH: ${{ github.workspace }}/Swift-Rnp/Build/RNP-AppStore.xcarchive/Products/Applications/RNP.app
      run: ./scripts/sandbox-audit.sh

    - name: Upload to App Store Connect
      if: startsWith(env.TAG, 'v')
      uses: Apple-Actions/upload-testflight-build@v5
      with:
        app-paths: ${{ github.workspace }}/Swift-Rnp/Build/RNP-AppStore.xcarchive/Products/Applications/RNP.app
        issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        api-key-id: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        api-private-key: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
